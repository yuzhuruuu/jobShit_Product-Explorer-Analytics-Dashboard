<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Explorer - Bagian 17</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }


        #product-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
        }


        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
        }


        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }


        .product-card h3 {
            margin-bottom: 10px;
        }

    </style>

</head>


<body>

    <h1>Product Explorer</h1>

    <div id="product-list"></div>


    <script src="main.js"></script>

</body>

</html>
